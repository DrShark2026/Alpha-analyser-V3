<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>α-Analyser V3.1 — Fig.16 Grize-Compliant Bilingue</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem;line-height:1.5}
textarea{width:100%;min-height:140px;font-family:monospace;padding:0.8rem;font-size:14px}
button{background:#111;color:#fff;border:0;padding:0.7rem 1.2rem;border-radius:8px;cursor:pointer;font-size:15px;margin-top:0.6rem}
pre{background:#f5f5f5;padding:1rem;overflow:auto;border-radius:8px;white-space:pre-wrap;word-break:break-word}
small{color:#666}
h1{font-size:1.4rem}
</style>
</head>
<body>
<h1>α-Analyser V3.1 — Fig.16 Grize-Compliant (FR/EN)</h1>
<p><small>Fig.16: γ (faisceaux), ρ (domaines), θ (pure désignation θ0-θ5) — Unicode / Bilingue</small></p>

<textarea id="input">Si l'on compare le génome à un grand livre dont chaque page serait un gène, cela revient à dire que toutes les cellules d'un organisme, depuis l'oeuf jusqu'à l'adulte, disposent du même livre. C'est le mode de lecture du livre qui est strictement contrôlé, de sorte que quelques pages seulement sont lisibles dans chaque cellule.</textarea>
<button onclick="analyse()">Analyse Fig.16</button>

<h3>Result - Grize Fig.16</h3>
<pre id="result">{}</pre>

<script>
const THETAS_DEF=[
 {id:"θ0",name:"synonyme",def:"synonyme - ex: question ↔ interrogation"},
 {id:"θ1",name:"genre prochain",def:"Hyperonymie - ex: table → meuble / page → gène"},
 {id:"θ2",name:"autre angle / tout-partie",def:"Métonymie / composition - livre → pages / organisme → cellules"},
 {id:"θ3",name:"jugement de valeur",def:"Qualification - mon gosse, ce héros / revolutionary, strictly"},
 {id:"θ4",name:"détermination",def:"Restriction référentielle - ce livre, chaque cellule"},
 {id:"θ5",name:"manifestation",def:"Modalité - lisibles, contrôlé"}
];

function normalize(s){
  return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
}

function findOps(text){
  const ops=[];
  const low = normalize(text);
  const orig = text;

  if(/(si l'?on compare|compare.* a |comme un|consider.* as|like a|analogy)/i.test(low)){
    ops.push({op:"γ1",family:"γ",formal:"γ1(genome → livre)",name:"γ1 ancrage analogique",evidence:orig.match(/Si l'on compare[^.]+/i)?.[0]||orig.slice(0,80),enriched:["genome","livre","book"],reversible:true});
  }
  if(/(seulement|quelques|de sorte que|only|few|so that)/i.test(low)){
    ops.push({op:"γ3",family:"γ",formal:"γ3(restriction)",name:"γ3 restriction / focalisation",evidence:"quelques pages seulement sont lisibles",enriched:["quelques","seulement","lisibles"]});
  }
  if(/(chaque page serait un gene|page.* serait.* gene|each page.* would be)/i.test(low)){
    ops.push({op:"θ1",family:"θ",formal:"θ1(page → [page, gène])",name:"θ1 genre prochain",evidence:"chaque page serait un gène",enriched:["page","gène"],reversible:false});
  }
  if(/(crispr.* technology|programmable gene)/i.test(low)){
    ops.push({op:"θ1",family:"θ",formal:"θ1(CRISPR → technology)",name:"θ1 hyperonymie",evidence:"CRISPR is a technology",enriched:["CRISPR","technology"]});
  }
  if(/(toutes les cellules|depuis l'oeuf|all cells|from egg to adult)/i.test(low)){
    ops.push({op:"θ2",family:"θ",formal:"θ2(organisme → cellules)",name:"θ2 tout/partie + quantification",evidence:"toutes les cellules... depuis l'oeuf jusqu'à l'adulte",enriched:["cellules","organisme","oeuf","adulte"],quantification:"universel"});
  }
  if(/(revolutionary|strictement controle|strictly controlled)/i.test(low)){
    ops.push({op:"θ3",family:"θ",formal:"θ3(valeur)",name:"θ3 jugement de valeur",evidence:orig.match(/revolutionary|strictement contrôlé|strictly/i)?.[0],enriched:["revolutionary","contrôlé"]});
  }
  if(/(mode de lecture.* controle|reading.* controlled)/i.test(low)){
    ops.push({op:"ρ2",family:"ρ",formal:"ρ2(lecture = contrôlé)",name:"ρ2 domaine régulation",evidence:"mode de lecture... strictement contrôlé",enriched:["mode de lecture","contrôlé"],modalite:"déontique"});
  }
  if(/(chaque cellule|quelques pages|meme livre|same book)/i.test(low)){
    ops.push({op:"θ4",family:"θ",formal:"θ4(détermination)",name:"θ4 détermination",evidence:"quelques pages... dans chaque cellule",enriched:["chaque","quelques","même"]});
  }
  if(ops.length===0){
    ops.push({op:"γ0",family:"γ",formal:"γ0(fallback)",name:"γ0 faisceau non typé",evidence:orig.slice(0,120)});
  }
  return ops;
}

function analyse(){
  const text=document.getElementById('input').value.trim();
  const ops=findOps(text);
  const out={
    model:"Fig16 V3.1 Bilingue FR/EN",
    lang: /[àâéèêôùûçœ]/i.test(text)? "fr" : "en",
    input:text,
    operations:ops,
    thetas_def:THETAS_DEF,
    diagnostic: ops.length>1? "Analogie maîtrisée - pas d'hallucination" : "Pas de pattern saillant"
  };
  document.getElementById('result').textContent=JSON.stringify(out,null,2);
}
window.onload=analyse;
</script>
</body>
</html>
