<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>α-Analyser V2.2 - Fig.16 Grize Compliant</title>
<style>
body{font-family:system-ui;max-width:800px;margin:20px auto;padding:16px;line-height:1.5}
textarea{width:100%;height:140px;padding:12px;font-size:16px}
button{background:#111;color:#fff;padding:12px 20px;border:0;border-radius:8px;font-size:16px;margin-top:12px;cursor:pointer}
.card{border:1px solid #ddd;border-radius:12px;padding:12px;margin:10px 0}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;margin-right:6px}
.th{background:#dbeafe}.ga{background:#dcfce7}.rh{background:#fef9c3}
pre{white-space:pre-wrap;background:#f6f6f6;padding:12px;border-radius:8px;overflow:auto}
</style>
</head>
<body>
<h2>α-Analyser V2.2 — Fig.16 Grize-Compliant</h2>
<p>Fig.16: γ (faisceaux), ρ (domaines), θ (pure désignation θ0-θ5)</p>
<textarea id="input">CRISPR-Cas9 is a revolutionary, programmable gene-editing technology derived from natural bacterial immune systems. It uses a Cas9 protein scissor and a single guide RNA (sgRNA) to locate and cleanly cut specific DNA strands, allowing scientists to add, remove, or alter genetic material.</textarea>
<button onclick="analyse()">Analyse Fig.16</button>
<div id="out"></div>
<script>
const THETAS = [
  {id:'θ0', name:'synonyme', def:'Introduit un synonyme - ex: question ↔ interrogation'},
  {id:'θ1', name:'genre prochain', def:'Hyperonymie - ex: table ↔ meuble'},
  {id:'θ2', name:'autre angle', def:'Métonymie - ex: Ministère ↔ Quai dOrsay'},
  {id:'θ3', name:'jugement de valeur', def:'Qualification - ex: mon gosse, ce héros'},
  {id:'θ4', name:'vidage', def:'Vide sémantique - ex: Mac ↔ machin'},
  {id:'θ5', name:'cotyponyme commun', def:'Nom commun thème+phore - Cas9+scissor→cutting_instrument', poles:['Cas9','scissor'], abstraction:'cutting_instrument'}
];
function analyse(){
  const text=document.getElementById('input').value;
  const ops=[];
  if(/is a.* technology/i.test(text)) ops.push({op:'θ1',family:'th',formal:'θ1(CRISPR-Cas9) → [CRISPR-Cas9, technology]',name:'θ1 genre prochain - hyperonymie',evidence:text.split('.')[0],enriched:['CRISPR-Cas9','technology'],reversible:true});
  const vals=text.match(/revolutionary|programmable|cleanly/g)||[];
  vals.forEach(m=>ops.push({op:'θ3',family:'th',formal:`θ3(object) → [object, ${m}]`,name:'θ3 jugement de valeur - qualification',evidence:m,enriched:[m],reversible:true}));
  if(/Cas9.*scissor|scissor/i.test(text)) ops.push({op:'θ5',family:'th',formal:'θ5(Cas9, scissor) → [cutting_instrument]',name:'θ5 cotyponyme commun thème+phore',poles:['Cas9','scissor'],abstraction:'cutting_instrument',evidence:'Cas9 protein scissor',enriched:['Cas9','scissor','cutting_instrument'],reversible:true});
  if(/Cas9 protein|sgRNA/i.test(text)) ops.push({op:'γ1',family:'y',formal:'γ1(CRISPR-Cas9) → [Cas9 protein, sgRNA]',name:'γ1 ingrédient - faisceau',evidence:'Cas9 protein and sgRNA',enriched:['Cas9 protein','sgRNA'],reversible:true});
  if(/locate|cut/i.test(text)) ops.push({op:'γ2',family:'y',formal:'γ2(CRISPR) → [locate, cut]',name:'γ2 processus interne - faisceau',evidence:'locate and cleanly cut',enriched:['locate','cut'],reversible:true});
  if(/bacterial immune/i.test(text)) ops.push({op:'ρ3',family:'p',formal:'ρ3(CRISPR) → [origin: bacterial immune systems]',name:'ρ3 domaine source',evidence:'derived from bacterial immune systems',enriched:['bacterial immune systems'],reversible:false});
  if(/scissor/i.test(text)) ops.push({op:'ρ4',family:'p',formal:'ρ4(Cas9) → [phore analogique: scissor]',name:'ρ4 extension analogique - domaine',evidence:'Cas9 protein scissor',enriched:['Cas9','scissor - phore'],reversible:false});
  const result={model:'Fig16 V2.2 Grize-Compliant',input:text,operations:ops,thetas_def:THETAS,final_class:[...new Set(ops.flatMap(o=>o.enriched))]};
  document.getElementById('out').innerHTML=`<h3>Result - Grize Fig.16</h3><pre>${JSON.stringify(result,null,2)}</pre>`+ops.map(o=>`<div class=card><span class=badge ${o.family=='th'?'th':o.family=='y'?'ga':'rh'}>${o.op}</span><b>${o.name}</b><br><code>${o.formal}</code><br><small>${o.evidence}</small></div>`).join('');
}
</script>
</body>
</html>
